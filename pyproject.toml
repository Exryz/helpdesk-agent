[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helpdesk-agent"
version = "0.1.0"
description = "An open-source IT helpdesk agent: hybrid RAG with citations, ticket actions over MCP, evals, and cost/latency telemetry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Paul Andrei Datinguinoo" }]
dependencies = [
    "litellm>=1.50",
    "langgraph>=0.2",
    "mcp>=1.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.21",
    "httpx>=0.27",
    "qdrant-client>=1.10",
    "fastembed>=0.4",
    "rank-bm25>=0.2.2",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ui = ["chainlit>=1.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
helpdesk-ingest = "helpdesk.ingest:main"
helpdesk-mcp = "helpdesk.mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/helpdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src"]
