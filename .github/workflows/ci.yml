name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Type check with mypy
        run: |
          mypy

      - name: Run unit and integration tests
        run: |
          pytest -q

      - name: Run offline retrieval eval smoke test
        run: |
          python -m evals.run_evals --mode retrieval --retrieval-modes bm25,dense,hybrid,hybrid_rerank --limit 10 --offline
